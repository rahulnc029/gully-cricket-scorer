name: Build & Release Gully Cricket Scorer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GullyCricketScorer-v1.0.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Gully Cricket Scorer v1.0.0 (Release APK)"
          body: |
            🏏 **Gully Cricket Scorer - Android Release**
            
            ### Features:
            - Fast, one-tap live ground scoring
            - Custom over & extra rules (Wides/No-Balls runs, reball toggle)
            - Complete ball-by-ball history & undo
            - Target chase calculator & run rate metrics
            - Instant WhatsApp match summary sharing
            
            👉 **Download the `.apk` file below and install it directly on your Android phone.**
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
